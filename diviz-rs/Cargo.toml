[package]
name = "diviz-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.36", features = ["wgpu"] }
egui = "0.36"
dicom-object = "0.10"
dicom-core = "0.10"
dicom-pixeldata = { version = "0.10", features = ["charls"] }
rfd = "0.17"
rayon = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6.0"

[[bin]]
name = "diviz-rs"
path = "src/main.rs"

[lib]
name = "diviz_rs_app"
path = "src/lib.rs"
