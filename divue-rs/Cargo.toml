[package]
name = "divue-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.36"
egui = "0.36"
egui_extras = "0.36"
dicom_viewer = { path = "../dicom_viewer" }
dicom-core = "0.10"
dicom-dictionary-std = "0.10"
rfd = "0.17"
dicor_rs = { package = "dicor-rs", path = "../dicor-rs" }

# clipboard helper for copy-on-right-click
copypasta = "0.10"

[[bin]]
name = "divue"
path = "src/main.rs"

[lib]
name = "divue_rs"
path = "src/lib.rs"

# Pin the transitive `windows` crate used by wgpu-hal/gpu-allocator: 0.62.2
# broke the Direct3D12 interface hierarchy they rely on. Remove once wgpu
# ships a release compatible with windows 0.62.2+.
[target.'cfg(windows)'.dependencies]
windows = "=0.62.1"
